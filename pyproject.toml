[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes_prediction"
version = "0.1.0"
description = "Pipelines Kedro para predicao de diabetes (Insper - Deployment / Production-Ready Data Science)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "kedro~=1.6.0",
    "kedro-datasets[pandas,pickle,json]>=8.0",
    "kedro-viz>=12.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
notebook = ["ipython>=8.10", "jupyterlab>=3.0", "notebook", "matplotlib", "seaborn", "plotly"]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
diabetes-prediction = "diabetes_prediction.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.kedro]
package_name = "diabetes_prediction"
project_name = "diabetes-prediction"
kedro_init_version = "1.6.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.kedro_telemetry]
project_id = "a7430a8e20ee4785a86cef0533c1831b"
